name: QuartzTeachers
options:
  bundleIdPrefix: ca.russellgordon
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "15.0"

targets:
  QuartzTeachers:
    type: application
    platform: macOS
    sources:
      - path: QuartzTeachers
      # The colour schemes and Ontario course lookup are the toolchain's
      # own support files, bundled so the app offers the same choices and
      # suggestions as the command-line wizard.
      - path: ../support/colour_schemes.json
        buildPhase: resources
      - path: ../support/ontario_secondary_courses.json
        buildPhase: resources
      # The launcher scripts, so the app can initialize a brand-new
      # working folder (same files export-scripts would deliver).
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
    info:
      path: QuartzTeachers/Info.plist
      properties:
        CFBundleDisplayName: Containerized Quartz for Teachers
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.education
        NSAppTransportSecurity:
          # The embedded preview loads http://localhost:8081 (plain HTTP).
          NSAllowsLocalNetworking: true
        NSHumanReadableCopyright: "MIT License"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ca.russellgordon.QuartzTeachers
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  QuartzTeachersTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/QuartzTeachersTests
      - path: Tests/Shared
      # Fixture ingredients: the real launcher scripts and the Example
      # Course's config, so tests can build a disposable workspace.
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
      - path: ../support/example_course/EXC2O/course_config.json
        buildPhase: resources
    dependencies:
      - target: QuartzTeachers
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/QuartzTeachers.app/Contents/MacOS/QuartzTeachers"
        BUNDLE_LOADER: "$(TEST_HOST)"

  QuartzTeachersUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/QuartzTeachersUITests
      - path: Tests/Shared
      - path: ../setup.sh
        buildPhase: resources
      - path: ../preview.sh
        buildPhase: resources
      - path: ../deploy.sh
        buildPhase: resources
      - path: ../support/example_course/EXC2O/course_config.json
        buildPhase: resources
    dependencies:
      - target: QuartzTeachers
    settings:
      base:
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated

schemes:
  QuartzTeachers:
    build:
      targets:
        QuartzTeachers: all
        QuartzTeachersTests: [test]
        QuartzTeachersUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QuartzTeachersTests
        - QuartzTeachersUITests
